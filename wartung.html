<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex, nofollow">
<title>Wir sind bald wieder online — PUTZ Real Estate</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0b0c'/><circle cx='32' cy='32' r='14' fill='%23fbe48b'/></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 22px;
    background: #0b0b0c;
    color: #fff;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    text-align: center;
    line-height: 1.65;
  }
  /* Dezenter goldener Schimmer wie auf der Startseite */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 80% 15%, rgba(251,228,139,0.13), transparent 55%);
    pointer-events: none;
  }
  .box { position: relative; max-width: 30rem; }
  .logo { width: 148px; height: auto; margin-bottom: 40px; }
  h1 {
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    text-wrap: balance;
  }
  h1 .hl { color: #fbe48b; }
  p { color: rgba(255,255,255,0.62); font-size: 15.5px; }
  .rule {
    width: 46px;
    height: 2px;
    background: #fbe48b;
    margin: 34px auto;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="assets/img/logo.png" alt="PUTZ Real Estate" class="logo">
    <h1>Unsere Website <span class="hl">PUTZT</span> sich gerade für euch heraus</h1>
    <div class="rule"></div>
    <p>Wir sind bald online.</p>
  </div>
</body>
</html>
